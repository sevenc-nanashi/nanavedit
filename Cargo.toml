[package]
name = "nanavedit"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
gpui = { package = "gpui-box", git = "https://github.com/fran0220/gpui-box", tag = "v0.2.0" }
gpui_platform = { package = "gpui-box-platform", git = "https://github.com/fran0220/gpui-box", tag = "v0.2.0" }
gpui_kit = { package = "gpui-box-kit", git = "https://github.com/fran0220/gpui-box", tag = "v0.2.0" }
anyhow = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
async-channel = "2"
aviutl2-sys = "=0.49.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
raw-window-handle = "0.6"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "dx12", "wgsl"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[patch.crates-io]
block = { git = "https://github.com/fran0220/gpui-box", tag = "v0.2.0" }
